name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install beads CLI
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.0.0/beads_1.0.0_linux_amd64.tar.gz" -o "$tmp_dir/beads.tar.gz"
          tar -xzf "$tmp_dir/beads.tar.gz" -C "$tmp_dir"
          install -m 0755 "$tmp_dir/bd" /usr/local/bin/bd
          command -v bd
          bd --version

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run unit tests
        run: bun run test:unit

      - name: Run integration tests
        run: bun run test:integration

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
